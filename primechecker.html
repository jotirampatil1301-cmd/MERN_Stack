<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prime Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
      width: 300px;
    }

    input {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    #result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Prime Checker</h2>
    
    <input type="number" id="numberInput" placeholder="Enter a number" />
    <br>
    
    <button onclick="checkPrime()">Check</button>
    
    <div id="result"></div>
  </div>

  <script>
    function isPrime(n){
      if(n <= 1) return false;
      if(n === 2) return true;
      if(n % 2 === 0) return false;

      for(let i = 3; i * i <= n; i += 2){
        if(n % i === 0) return false;
      }
      return true;
    }

    function checkPrime(){
      let input = document.getElementById("numberInput").value;
      let num = Number(input);
      let result = document.getElementById("result");

      if(input === ""){
        result.innerText = "Please enter a number!";
        result.style.color = "red";
        return;
      }

      if(isPrime(num)){
        result.innerText = num + " is a Prime Number";
        result.style.color = "green";
      } else {
        result.innerText = num + " is NOT a Prime Number";
        result.style.color = "red";
      }
    }
  </script>

</body>
</html>
